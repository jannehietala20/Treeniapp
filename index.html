<body>
  <!-- 1. RAKENNE (HTML) -->
  <h1>Treenipäiväkirja</h1>

  <div class="card">
    <label for="ohjelma">Valitse treeni</label>
    <select id="ohjelma"></select>
  </div>

  <div id="liikkeet"></div>
  <button id="tallenna">Tallenna treeni</button>

  <h2>Historia</h2>
  <div id="historia"></div>

<script>
// 2. TREENIOHJELMA (data)
// Muokkaa tätä: lisää omat treenisi ja liikkeesi.
// sarjat = suurin sarjamäärä (tyhjiksi jätettyjä sarjoja ei tallenneta)
// toistot = teksti, joten vaihteluvälit kuten "6–8" toimivat
// huom = vapaaehtoinen lisätieto
const OHJELMA = {
  "Voima A": [
    { nimi: "Takakyykky", sarjat: 5, toistot: "",
      huom: "Jaksotus: 4×6 → 5×5 → 4×4 → 3×3" },
    { nimi: "Penkkipunnerrus", sarjat: 4, toistot: "6–8" },
    { nimi: "Romanialainen maastaveto", sarjat: 3, toistot: "6–8" },
    { nimi: "Lat Pulldown", sarjat: 3, toistot: "8–12" },
    { nimi: "Reiden koukistus", sarjat: 3, toistot: "10–15" },
    { nimi: "Vatsat", sarjat: 3, toistot: "" }
  ],
  "Voima B": [
    { nimi: "Maastaveto", sarjat: 4, toistot: "5–6",
      huom: "3–4 sarjaa. Aluksi 5–6 toistoa, myöhemmin 3–5" },
    { nimi: "Penkki / kapea penkki", sarjat: 4, toistot: "5–8" },
    { nimi: "Bulgarialainen askelkyykky / split squat", sarjat: 3, toistot: "8–10 / jalka" },
    { nimi: "Kulmasoutu", sarjat: 4, toistot: "8–12", huom: "3–4 sarjaa" },
    { nimi: "Pystypunnerrus", sarjat: 3, toistot: "6–10" },
    { nimi: "Hauiskääntö", sarjat: 3, toistot: "10–15", huom: "2–3 sarjaa" },
    { nimi: "Ojentajat", sarjat: 3, toistot: "10–15", huom: "2–3 sarjaa" }
  ],
  "Voima C": [
    { nimi: "Etukyykky", sarjat: 4, toistot: "5–6" },
    { nimi: "Penkkipunnerrus", sarjat: 4, toistot: "6–8" },
    { nimi: "Hip thrust / glute bridge", sarjat: 3, toistot: "8–12" },
    { nimi: "Vinopenkki käsipainoilla", sarjat: 3, toistot: "8–12" },
    { nimi: "Lat Pulldown", sarjat: 3, toistot: "8–12" },
    { nimi: "Vipunostot", sarjat: 3, toistot: "12–20" },
    { nimi: "Vatsat", sarjat: 3, toistot: "" }
  ],
  "Painonnosto A": [
    { nimi: "Tempaus", sarjat: 6, toistot: "2", huom: "5–6 sarjaa" },
    { nimi: "Tempausveto", sarjat: 3, toistot: "3" },
    { nimi: "Takakyykky", sarjat: 4, toistot: "5", huom: "3–4 sarjaa" },
    { nimi: "T-Soutu", sarjat: 3, toistot: "", huom: "Tarvittaessa" }
  ],
  "Painonnosto B": [
    { nimi: "Rinnalleveto + työntö", sarjat: 5, toistot: "1+1", huom: "4–5 sarjaa" },
    { nimi: "Työntöveto", sarjat: 3, toistot: "3" },
    { nimi: "Etukyykky", sarjat: 4, toistot: "3–5", huom: "3–4 sarjaa" },
    { nimi: "Vauhtipunnerrus", sarjat: 4, toistot: "2", huom: "3–4 sarjaa" }
  ]
};

// 4. TALLENNUS selaimen muistiin (localStorage)
// Vanhat nimet -> uudet, jotta aiempi historia näkyy uusilla nimillä
const NIMIMUUTOKSET = {
  "Voima A – Takakyykkypainotteinen": "Voima A", "Voima B – Maastaveto + ylävartalo": "Voima B",
  "Voima C – Etukyykky + penkki + hypertrofia": "Voima C",
  "Tempauspainotteinen": "Painonnosto A", "C&J-painotteinen": "Painonnosto B",
  "Kevyt takakyykky": "Takakyykky", "Yläselkä / vatsa": "T-Soutu", "Clean pull": "Työntöveto",
  "Jerk-variaatio": "Vauhtipunnerrus", "Leuanveto / ylätalja": "Lat Pulldown",
  "Takareisi": "Reiden koukistus", "Soutu": "Kulmasoutu", "Hauis": "Hauiskääntö",
  "Ojentaja": "Ojentajat", "Sivuviparit": "Vipunostot"
};
const uusiNimi = n => NIMIMUUTOKSET[n] ?? n;

function lataaHistoria() {
  try {
    const treenit = JSON.parse(localStorage.getItem("treenit")) || [];
    treenit.forEach(t => {
      t.treeni = uusiNimi(t.treeni);
      t.tulokset.forEach(r => r.liike = uusiNimi(r.liike));
    });
    return treenit;
  }
  catch { return []; }
}
function tallennaHistoria(treenit) {
  try { localStorage.setItem("treenit", JSON.stringify(treenit)); }
  catch { alert("Tallennus ei onnistunut tässä selaimessa."); }
}

// Suojaa omat tekstit, jotta kommentti ei riko sivua
function esc(teksti) {
  return String(teksti ?? "").replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
}

// Muuntaa vanhat tallennukset (pelkät painot) uuteen muotoon
function sarjatOf(tulos) {
  return tulos.sarjat ?? (tulos.painot || []).map(p => ({ paino: p, toistot: null }));
}

// Näyttää sarjat muodossa "80 kg × 6"
function sarjaTeksti(sarja) {
  const paino = sarja.paino != null ? sarja.paino + " kg" : "";
  const toistot = sarja.toistot != null ? sarja.toistot + " toistoa" : "";
  return paino && toistot ? `${sarja.paino} kg × ${sarja.toistot}` : paino || toistot;
}

// Etsi liikkeen viimeisin tulos historiasta
function edellinenTulos(liike) {
  const treenit = lataaHistoria();
  for (let i = treenit.length - 1; i >= 0; i--) {
    const loytyi = treenit[i].tulokset.find(t => t.liike === liike);
    if (loytyi) return { sarjat: sarjatOf(loytyi), kommentti: loytyi.kommentti };
  }
  return null;
}

// 5. NÄKYMÄN PIIRTÄMINEN
const valikko = document.getElementById("ohjelma");
Object.keys(OHJELMA).forEach(nimi => valikko.add(new Option(nimi, nimi)));

function naytaLiikkeet() {
  const liikkeet = OHJELMA[valikko.value];
  document.getElementById("liikkeet").innerHTML = liikkeet.map((l, i) => {
    const ed = edellinenTulos(l.nimi);
    let sarjaKentat = "";
    for (let s = 0; s < l.sarjat; s++) {
      const edSarja = ed?.sarjat[s];
      sarjaKentat += `<div class="row">
        <span>Sarja ${s + 1}</span>
        <span class="kentat">
          <input type="number" step="0.5" inputmode="decimal" class="paino"
                 data-liike="${i}" data-sarja="${s}" placeholder="${edSarja?.paino ?? ""}">
          <input type="number" step="1" inputmode="numeric" class="toistot"
                 data-liike="${i}" data-sarja="${s}" placeholder="${edSarja?.toistot ?? ""}">
        </span>
      </div>`;
    }
    return `<div class="card">
      <strong>${l.nimi}</strong>
      <div class="muted">${l.toistot ? `Tavoite: ${l.sarjat} × ${l.toistot}` : ""}${l.huom ? (l.toistot ? " · " : "") + l.huom : ""}</div>
      <div class="muted">Viimeksi: ${ed ? ed.sarjat.map(sarjaTeksti).join(" / ") : "ei vielä merkintöjä"}</div>
      ${ed?.kommentti ? `<div class="muted">Viime kommentti: ${esc(ed.kommentti)}</div>` : ""}
      <div class="row otsikot"><span></span><span class="kentat"><span>kg</span><span>toistot</span></span></div>
      ${sarjaKentat}
      <textarea class="kommentti" data-liike="${i}" rows="2" placeholder="Kommentti (vapaaehtoinen)"></textarea>
    </div>`;
  }).join("") + `<div class="card">
      <strong>Koko treenin kommentti</strong>
      <textarea id="treeniKommentti" rows="2" placeholder="Esim. fiilis, uni, kivut…"></textarea>
    </div>`;
}

function naytaHistoria() {
  const treenit = lataaHistoria().slice().reverse();
  document.getElementById("historia").innerHTML = treenit.length === 0
    ? `<p class="muted">Ei vielä tallennettuja treenejä.</p>`
    : treenit.map(t => `<div class="card">
        <strong>${esc(t.pvm)}</strong> – ${esc(t.treeni)}
        ${t.kommentti ? `<div class="muted">${esc(t.kommentti)}</div>` : ""}
        ${t.tulokset.map(r => `<div class="tulos">
          <div class="row"><span>${esc(r.liike)}</span><span>${sarjatOf(r).map(sarjaTeksti).join(" / ")}</span></div>
          ${r.kommentti ? `<div class="muted">💬 ${esc(r.kommentti)}</div>` : ""}
        </div>`).join("")}
      </div>`).join("");
}

// 6. TAPAHTUMAT: mitä tapahtuu, kun käyttäjä tekee jotain
valikko.addEventListener("change", naytaLiikkeet);

document.getElementById("tallenna").addEventListener("click", () => {
  const liikkeet = OHJELMA[valikko.value];
  const luku = kentta => kentta.value === "" ? null : Number(kentta.value);

  const tulokset = liikkeet.map((l, i) => {
    const sarjat = [];
    for (let s = 0; s < l.sarjat; s++) {
      const paino = luku(document.querySelector(`.paino[data-liike="${i}"][data-sarja="${s}"]`));
      const toistot = luku(document.querySelector(`.toistot[data-liike="${i}"][data-sarja="${s}"]`));
      if (paino !== null || toistot !== null) sarjat.push({ paino, toistot });
    }
    const kommentti = document.querySelector(`.kommentti[data-liike="${i}"]`).value.trim();
    return { liike: l.nimi, sarjat, kommentti };
  }).filter(t => t.sarjat.length > 0 || t.kommentti);

  const treeniKommentti = document.getElementById("treeniKommentti").value.trim();
  if (tulokset.length === 0 && !treeniKommentti) { alert("Syötä ainakin yksi sarja tai kommentti."); return; }

  const treenit = lataaHistoria();
  treenit.push({
    pvm: new Date().toLocaleDateString("fi-FI"),
    treeni: valikko.value,
    kommentti: treeniKommentti,
    tulokset
  });
  tallennaHistoria(treenit);
  naytaLiikkeet();
  naytaHistoria();
});

// Käynnistys
naytaLiikkeet();
naytaHistoria();
</script>
</body>
</html>
